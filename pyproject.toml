[project]
name = "openchorus"
version = "1.0.2"
description = "Free, open-source, self-hosted song studio: describe a song, get full tracks with vocals, cover art and stems."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shivam Singh" }]
requires-python = ">=3.10"
keywords = ["music-generation", "ai-music", "ace-step", "text-to-music", "suno-alternative", "self-hosted"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.44", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/kshivam4781/openchorus"
Issues = "https://github.com/kshivam4781/openchorus/issues"
Changelog = "https://github.com/kshivam4781/openchorus/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["data"]

[tool.ruff.lint]
# Real bugs only: syntax errors, undefined names, unused imports and variables.
select = ["E9", "F"]

name: Feature request
description: Suggest an idea for OpenChorus
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the song-making task, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: models
    attributes:
      label: Open models or tools that could power it
      description: OpenChorus only uses open, locally runnable models.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5" shellcheck-py
      - run: ruff check .
      - name: Check the shell scripts
        run: shellcheck -x *.sh scripts/*.sh

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  launchers:
    # The one-click start and stop scripts, on each system, with the demo engine.
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENCHORUS_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start and stop (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ./start_all.sh
          curl -fsS http://127.0.0.1:7777/api/status
          ./stop_all.sh
          sleep 2
          if curl -fs http://127.0.0.1:7777/api/status; then echo "still running"; exit 1; fi
      - name: Start and stop (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call start_all.bat < nul || exit /b 1
          curl -fsS http://127.0.0.1:7777/api/status || (type logs\openchorus.log & exit /b 1)
          call stop_all.bat
          ping -n 3 127.0.0.1 >nul
          curl -fs http://127.0.0.1:7777/api/status && (echo still running & exit /b 1)
          exit /b 0
      - name: Logs
        if: failure()
        shell: bash
        run: tail -n 50 logs/*.log || true

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser end-to-end run (demo engine)
        run: python tests/run_e2e.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/openchorus-shots
          if-no-files-found: ignore

  docker:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: openchorus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
